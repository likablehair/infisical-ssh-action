name: Fetch Infisical SSH
author: "LH"
description: "Fetch ssh keys from Infisical into your Github workflows"
branding:
  icon: "lock"
  color: "yellow"
inputs:
  client-id:
    description: "Machine Identity client ID"
    required: true
  client-secret:
    description: "Machine Identity secret key"
    required: true
  domain:
    description: "Infisical URL (defaults to https://app.infisical.com )"
    required: true
    default: "https://app.infisical.com"
  certificate-template-id:
    description: "The ID of the certificate template to use for generating SSH keys"
    required: true
  principals:
    description: "The principals to include in the SSH certificate (comma-separated)"
    required: true
  ttl:
    description: "The time-to-live (TTL) for the SSH certificate in seconds"
    required: false
    default: "1h"
  key-algorithm:
    description: "The key algorithm to use for generating SSH keys (e.g., `RSA_4096`, `ED25519`)"
    required: false
    default: "RSA_4096"
  file-output-path:
    description: "The path to save the file when export-type is set to `file`"
    required: false
    default: "/keys"
runs:
  using: "node20"
  main: "index.js"
